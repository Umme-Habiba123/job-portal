{% extends 'base.html' %}

{% block content %}




<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <form method="post" class="p-4 border rounded-4 shadow-sm bg-white" style="width: 100%; max-width: 420px;">

        <h3 class="text-center mb-4">Add Job</h3>


        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary w-100">
            Add Job
        </button>
    </form>

</div>






{% endblock content %}
